name: Wasmtime KMP CI and Publish

on:
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "build.gradle.kts"
      - "gradle-plugin/**"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "lib/**"
      - "settings.gradle.kts"
      - "scripts/**"
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]*"
      - "[0-9]*"
    paths:
      - ".github/workflows/publish.yml"
      - "build.gradle.kts"
      - "gradle-plugin/**"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "lib/**"
      - "settings.gradle.kts"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version (required when publishing)"
        required: false
        type: string
      publish:
        description: "Publish the merged repository to Maven Central"
        required: true
        default: false
        type: boolean

concurrency:
  group: wasmtime-kmp-${{ github.ref }}-${{ inputs.version || github.run_id }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.publish) }}

permissions:
  contents: read

env:
  WASMTIME_VERSION: "49.0.1"
  WASMTIME_RUST_VERSION: "1.96.0"

jobs:
  prepare:
    name: Resolve publication version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$MANUAL_PUBLISH" == "true" ]]; then
              publish=true
              if [[ -z "$MANUAL_VERSION" ]]; then
                echo "A version is required for manual publication" >&2
                exit 1
              fi
            fi
            version="${MANUAL_VERSION:-0.1.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            publish=true
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid Maven version: $version" >&2
            exit 1
          fi
          if [[ "$version" == *SNAPSHOT* ]]; then
            echo "SNAPSHOT versions are not allowed in isolated publication repositories" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  common:
    name: Build common/JVM/Web/WASI/plugin repository
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish architecture-neutral artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/release/common-repository"
          rm -rf "$repository"
          export WASMTIME_MAVEN_REPOSITORY="$repository"
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            "-PVERSION=$RELEASE_VERSION" \
            publishWasmtimeCommonToMavenRepository
          test -s "$repository/dev/brahmkshatriya/wasmtime/lib/$RELEASE_VERSION/lib-$RELEASE_VERSION.module"
          test -s "$repository/dev/brahmkshatriya/wasmtime/lib-jvm/$RELEASE_VERSION/lib-jvm-$RELEASE_VERSION.jar"
          test -s "$repository/dev/brahmkshatriya/wasmtime/lib-wasm-js/$RELEASE_VERSION/lib-wasm-js-$RELEASE_VERSION.klib"
          test -s "$repository/dev/brahmkshatriya/wasmtime/guest-runtime-wasm-wasi/$RELEASE_VERSION/guest-runtime-wasm-wasi-$RELEASE_VERSION.klib"
          test -s "$repository/dev/brahmkshatriya/wasmtime/wasmtime-kmp-gradle-plugin/$RELEASE_VERSION/wasmtime-kmp-gradle-plugin-$RELEASE_VERSION.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-kmp-repo-common-${{ needs.prepare.outputs.version }}
          path: release/common-repository
          if-no-files-found: error
          retention-days: 7

  android_arm64:
    name: Build Android ARM64 native payload
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK r29
        shell: bash
        run: sdkmanager "ndk;29.0.14206865"
      - uses: actions/cache@v4
        with:
          path: |
            lib/src/native/.deps/cargo
            lib/src/native/.deps/rustup
            lib/src/native/.deps/slim/aarch64-android
            lib/src/native/.deps/slim-target/aarch64-android
          key: wasmtime-android-arm64-49.0.1-rust-1.96.0-${{ hashFiles('lib/src/native/build-slim-wasmtime.sh') }}
      - name: Build Android ARM64 payload
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          set -euo pipefail
          bash lib/src/native/build-slim-wasmtime.sh android-arm64
          bash lib/src/native/build.sh android-arm64
          test -s lib/build/generated/jniLibs/arm64-v8a/libwasmtime_kmp.so
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-kmp-android-arm64-${{ needs.prepare.outputs.version }}
          path: lib/build/generated/jniLibs/arm64-v8a
          if-no-files-found: error
          retention-days: 7

  android_x64:
    name: Build Android x86_64 native payload
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK r29
        shell: bash
        run: sdkmanager "ndk;29.0.14206865"
      - uses: actions/cache@v4
        with:
          path: |
            lib/src/native/.deps/cargo
            lib/src/native/.deps/rustup
            lib/src/native/.deps/slim/x86_64-android
            lib/src/native/.deps/slim-target/x86_64-android
          key: wasmtime-android-x64-49.0.1-rust-1.96.0-${{ hashFiles('lib/src/native/build-slim-wasmtime.sh') }}
      - name: Build Android x86_64 payload
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          set -euo pipefail
          bash lib/src/native/build-slim-wasmtime.sh android-x86_64
          bash lib/src/native/build.sh android-x86_64
          test -s lib/build/generated/jniLibs/x86_64/libwasmtime_kmp.so
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-kmp-android-x64-${{ needs.prepare.outputs.version }}
          path: lib/build/generated/jniLibs/x86_64
          if-no-files-found: error
          retention-days: 7

  android:
    name: Package Android x86_64 + ARM64 AAR
    needs:
      - prepare
      - android_arm64
      - android_x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasmtime-kmp-android-arm64-${{ needs.prepare.outputs.version }}
          path: lib/build/generated/jniLibs/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: wasmtime-kmp-android-x64-${{ needs.prepare.outputs.version }}
          path: lib/build/generated/jniLibs/x86_64
      - name: Publish Android AAR from prebuilt ABI payloads
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -s lib/build/generated/jniLibs/arm64-v8a/libwasmtime_kmp.so
          test -s lib/build/generated/jniLibs/x86_64/libwasmtime_kmp.so
          repository="$GITHUB_WORKSPACE/release/android-repository"
          rm -rf "$repository"
          export WASMTIME_MAVEN_REPOSITORY="$repository"
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            "-PVERSION=$RELEASE_VERSION" \
            -PwasmtimeAndroidPrebuilt=true \
            publishWasmtimeAndroidToMavenRepository
          aar="$repository/dev/brahmkshatriya/wasmtime/lib-android/$RELEASE_VERSION/lib-android-$RELEASE_VERSION.aar"
          test -s "$aar"
          python3 - "$aar" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=set(z.namelist())
          required={"jni/x86_64/libwasmtime_kmp.so","jni/arm64-v8a/libwasmtime_kmp.so"}
          missing=required-names
          if missing: raise SystemExit(f"missing Android JNI payloads: {sorted(missing)}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-kmp-repo-android-${{ needs.prepare.outputs.version }}
          path: release/android-repository
          if-no-files-found: error
          retention-days: 7

  linux_x64:
    name: Build Linux x64 repository
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v4
        with:
          path: |
            lib/src/native/.deps/cargo
            lib/src/native/.deps/rustup
            lib/src/native/.deps/slim/x86_64-linux
            lib/src/native/.deps/slim-target/x86_64-linux
          key: wasmtime-linux-x64-49.0.1-rust-1.96.0-${{ hashFiles('lib/src/native/build-slim-wasmtime.sh') }}
      - name: Publish Linux x64 artifact and JVM classifier
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/release/linux-x64-repository"
          rm -rf "$repository"
          export WASMTIME_MAVEN_REPOSITORY="$repository"
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            "-PVERSION=$RELEASE_VERSION" \
            publishWasmtimeLinuxX64ToMavenRepository
          test -s "$repository/dev/brahmkshatriya/wasmtime/lib-linuxx64/$RELEASE_VERSION/lib-linuxx64-$RELEASE_VERSION.klib"
          classifier="$repository/dev/brahmkshatriya/wasmtime/lib-jvm/$RELEASE_VERSION/lib-jvm-$RELEASE_VERSION-linux-x64.jar"
          test -s "$classifier"
          unzip -l "$classifier" | grep -F 'native/linux-x64/libwasmtime_kmp.so'
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-kmp-repo-linux-x64-${{ needs.prepare.outputs.version }}
          path: release/linux-x64-repository
          if-no-files-found: error
          retention-days: 7

  linux_arm64:
    name: Build Linux ARM64 repository
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v4
        with:
          path: |
            lib/src/native/.deps/cargo
            lib/src/native/.deps/rustup
            lib/src/native/.deps/slim/aarch64-linux
            lib/src/native/.deps/slim-target/aarch64-linux
          key: wasmtime-linux-arm64-49.0.1-rust-1.96.0-${{ hashFiles('lib/src/native/build-slim-wasmtime.sh') }}
      - name: Publish Linux ARM64 artifact and JVM classifier
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          repository="$GITHUB_WORKSPACE/release/linux-arm64-repository"
          rm -rf "$repository"
          export WASMTIME_MAVEN_REPOSITORY="$repository"
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            "-PVERSION=$RELEASE_VERSION" \
            publishWasmtimeLinuxArm64ToMavenRepository
          test -s "$repository/dev/brahmkshatriya/wasmtime/lib-linuxarm64/$RELEASE_VERSION/lib-linuxarm64-$RELEASE_VERSION.klib"
          classifier="$repository/dev/brahmkshatriya/wasmtime/lib-jvm/$RELEASE_VERSION/lib-jvm-$RELEASE_VERSION-linux-arm64.jar"
          test -s "$classifier"
          unzip -l "$classifier" | grep -F 'native/linux-arm64/libwasmtime_kmp.so'
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-kmp-repo-linux-arm64-${{ needs.prepare.outputs.version }}
          path: release/linux-arm64-repository
          if-no-files-found: error
          retention-days: 7

  windows_x64:
    name: Build Windows x64 repository
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v4
        with:
          path: |
            lib/src/native/.deps/cargo
            lib/src/native/.deps/rustup
            lib/src/native/.deps/slim/x86_64-windows-gnu
            lib/src/native/.deps/slim-target/x86_64-windows-gnu
          key: wasmtime-windows-x64-49.0.1-rust-1.96.0-${{ hashFiles('lib/src/native/build-slim-wasmtime.sh') }}
      - name: Publish Windows x64 artifact natively
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          WASMTIME_WINDOWS_TOOLCHAIN_BIN: C:/msys64/mingw64/bin
          CMAKE_GENERATOR: Ninja
        run: |
          set -euo pipefail
          case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) ;; *) echo "not running on Windows" >&2; exit 1;; esac
          repository_posix="$PWD/release/windows-x64-repository"
          repository_windows="$(cygpath -w "$repository_posix")"
          rm -rf "$repository_posix"
          export WASMTIME_MAVEN_REPOSITORY="$repository_windows"
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            "-PVERSION=$RELEASE_VERSION" \
            publishWasmtimeWindowsX64ToMavenRepository
          test -s "$repository_posix/dev/brahmkshatriya/wasmtime/lib-mingwx64/$RELEASE_VERSION/lib-mingwx64-$RELEASE_VERSION.klib"
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-kmp-repo-windows-x64-${{ needs.prepare.outputs.version }}
          path: release/windows-x64-repository
          if-no-files-found: error
          retention-days: 7

  macos_x64:
    name: Build macOS x64 repository
    needs: prepare
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v4
        with:
          path: |
            lib/src/native/.deps/cargo
            lib/src/native/.deps/rustup
            lib/src/native/.deps/slim/x86_64-macos
            lib/src/native/.deps/slim-target/x86_64-macos
          key: wasmtime-macos-x64-49.0.1-rust-1.96.0-${{ hashFiles('lib/src/native/build-slim-wasmtime.sh') }}
      - name: Publish macOS x64 artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          repository="$GITHUB_WORKSPACE/release/macos-x64-repository"
          rm -rf "$repository"
          export WASMTIME_MAVEN_REPOSITORY="$repository"
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            "-PVERSION=$RELEASE_VERSION" \
            publishWasmtimeMacosX64ToMavenRepository
          test -s "$repository/dev/brahmkshatriya/wasmtime/lib-macosx64/$RELEASE_VERSION/lib-macosx64-$RELEASE_VERSION.klib"
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-kmp-repo-macos-x64-${{ needs.prepare.outputs.version }}
          path: release/macos-x64-repository
          if-no-files-found: error
          retention-days: 7

  macos_arm64:
    name: Build macOS ARM64 repository
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v4
        with:
          path: |
            lib/src/native/.deps/cargo
            lib/src/native/.deps/rustup
            lib/src/native/.deps/slim/aarch64-macos
            lib/src/native/.deps/slim-target/aarch64-macos
          key: wasmtime-macos-arm64-49.0.1-rust-1.96.0-${{ hashFiles('lib/src/native/build-slim-wasmtime.sh') }}
      - name: Publish macOS ARM64 artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          repository="$GITHUB_WORKSPACE/release/macos-arm64-repository"
          rm -rf "$repository"
          export WASMTIME_MAVEN_REPOSITORY="$repository"
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            "-PVERSION=$RELEASE_VERSION" \
            publishWasmtimeMacosArm64ToMavenRepository
          test -s "$repository/dev/brahmkshatriya/wasmtime/lib-macosarm64/$RELEASE_VERSION/lib-macosarm64-$RELEASE_VERSION.klib"
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-kmp-repo-macos-arm64-${{ needs.prepare.outputs.version }}
          path: release/macos-arm64-repository
          if-no-files-found: error
          retention-days: 7

  ios_arm64:
    name: Build iOS ARM64 repository
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v4
        with:
          path: |
            lib/src/native/.deps/cargo
            lib/src/native/.deps/rustup
            lib/src/native/.deps/slim/aarch64-ios
            lib/src/native/.deps/slim-target/aarch64-ios
          key: wasmtime-ios-arm64-49.0.1-rust-1.96.0-${{ hashFiles('lib/src/native/build-slim-wasmtime.sh') }}
      - name: Publish iOS ARM64 artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          repository="$GITHUB_WORKSPACE/release/ios-arm64-repository"
          rm -rf "$repository"
          export WASMTIME_MAVEN_REPOSITORY="$repository"
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            "-PVERSION=$RELEASE_VERSION" \
            publishWasmtimeIosArm64ToMavenRepository
          test -s "$repository/dev/brahmkshatriya/wasmtime/lib-iosarm64/$RELEASE_VERSION/lib-iosarm64-$RELEASE_VERSION.klib"
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-kmp-repo-ios-arm64-${{ needs.prepare.outputs.version }}
          path: release/ios-arm64-repository
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Merge and verify complete Maven repository
    needs:
      - prepare
      - common
      - android
      - linux_x64
      - linux_arm64
      - windows_x64
      - macos_x64
      - macos_arm64
      - ios_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          pattern: wasmtime-kmp-repo-*-${{ needs.prepare.outputs.version }}
          path: release/shards
      - name: Merge and verify repository
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t shards < <(find release/shards -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#shards[@]}" -eq 8
          python3 scripts/merge-wasmtime-repositories.py \
            release/maven-repository "${shards[@]}"
          python3 scripts/verify-wasmtime-repository.py \
            release/maven-repository "$RELEASE_VERSION"
          bash scripts/verify-wasmtime-consumer.sh \
            release/maven-repository "$RELEASE_VERSION"
          du -sh release/maven-repository
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-kmp-maven-repo-${{ needs.prepare.outputs.version }}
          path: release/maven-repository
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact repository to Maven Central
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - merge
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: wasmtime-kmp-maven-repo-${{ needs.prepare.outputs.version }}
          path: release/maven-repository
      - name: Restore Gradle properties and signing key
        shell: bash
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES_CONTENT }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PROPERTIES_CONTENT"
          test -n "$GPG_SECRET_KEY_RING_BASE64"
          gradle_dir="$HOME/.gradle"
          properties_file="$gradle_dir/gradle.properties"
          keyring="$gradle_dir/wasmtime-kmp-secret-key.gpg"
          mkdir -p "$gradle_dir"
          printf '%s' "$GRADLE_PROPERTIES_CONTENT" > "$properties_file"
          printf '%s' "$GPG_SECRET_KEY_RING_BASE64" | tr -d '\r\n ' | openssl base64 -d -A > "$keyring"
          test -s "$keyring"
          awk '!/^signing.secretKeyRingFile=/' "$properties_file" > "$properties_file.tmp"
          mv "$properties_file.tmp" "$properties_file"
          printf '\nsigning.secretKeyRingFile=%s\n' "$keyring" >> "$properties_file"
          chmod 600 "$properties_file" "$keyring"
      - name: Sign and publish one Central deployment
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/publish-wasmtime-central-bundle.sh \
            "$GITHUB_WORKSPACE/release/maven-repository" \
            "$RELEASE_VERSION" \
            "$GITHUB_WORKSPACE/release/wasmtime-kmp-$RELEASE_VERSION.zip"
      - name: Preserve failed Central bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-wasmtime-kmp-central-bundle-${{ needs.prepare.outputs.version }}
          path: release/wasmtime-kmp-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: ignore
          retention-days: 7
